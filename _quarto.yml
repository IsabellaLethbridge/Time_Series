project:
  type: website
  output-dir: _site
  render:
    - "*.qmd"
    - "!rough.qmd" # Excludes draft files from rendering
    - "!projects/*_claude.qmd" # Excludes working copies
  resources: 
    - "section-1/S1_Chapters_1-6.html"
    - "section-1/S1_Conditional_Variance_Models.html"
    - "section-1/S1_Spectral_Analysis.html"
    - "section-2/S2_Exponential_Smoothing.html"
    - "section-2/S2_Hidden_Markov_Models.html"
    - "section-2/S2_Regression.html"
    - "section-2/S2_State_Space_Models.html"

website:
  title: "Lagged & Loaded"
  navbar:
    search: true
    right:
      - icon: github
        href: https://github.com/IsabellaLethbridge/Time_Series
        aria-label: GitHub repository
    left:
      - text: "Home"
        href: index.qmd
      - text: "Reflective Commentary"
        href: reflective-commentary.qmd
      - text: "AI Use Log"
        href: ai-use-log.qmd
      - text: "Sections"
        menu:
          - text: "Section 1"
            href: section-1/section-1.qmd
          - text: "Section 2"
            href: section-2/section-2.qmd
      - text: "Projects"
        menu:
          - text: "Projects Overview"
            href: projects/index.qmd
          - text: "Project 1"
            href: projects/project-01.qmd
          - text: "Project 2"
            href: projects/project-02.qmd
          - text: "Project 3"
            href: projects/project-03.qmd
          - text: "Project 4"
            href: projects/project-04.qmd
      - text: "Journal"
        href: journal/entries.qmd
      - text: "Appendix"
        menu:
          - text: "Code & Data"
            href: appendix/code-and-data.qmd

format:
  html:
    theme: [lux, custom.scss]
    toc: true
    toc-depth: 3
    code-fold: show
    highlight-style: dracula-light.theme # light version of Dracula theme
    code-block-bg: "#FFF5FB"            # Dracula light (Alucard) background
    code-block-border-left: "#A3144D"   # Dracula pink
    code-copy: true                     # copy button on every code block

execute:
  freeze: auto   # re-run a page's code only when that page changes
